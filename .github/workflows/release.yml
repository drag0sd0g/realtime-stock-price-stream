name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper versioning
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Build and test
        run: mvn clean verify

      - name: Prepare and perform release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn --batch-mode release:prepare release:perform -DreleaseVersion=${{ steps.version.outputs.version }} -Dusername=github-actions[bot] -Dpassword=${GITHUB_TOKEN} -DpushChanges=true

      # The Maven Release Plugin pushes the tag, so you do not need a separate git push --tags step.

      - name: Get final version (after release, should match tag)
        id: final_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Final version: $VERSION"

      - name: Package for release
        run: mvn package -DskipTests

      - name: Locate artifact
        id: jar
        run: |
          JAR_PATH=$(find target -name "*.jar" | head -n 1)
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT
          echo "Artifact path: $JAR_PATH"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.final_version.outputs.version }}
          name: Release v${{ steps.final_version.outputs.version }}
          body: |
            ## Changes in this release

            See the [CHANGELOG](https://github.com/drag0sd0g/realtime-stock-price-stream/compare/v${{ steps.final_version.outputs.version }}...main) for details.

            ## Installation

            Download the JAR file below and run:
            ```bash
            java -jar $(basename ${{ steps.jar.outputs.jar_path }}) --help
            ```
          files: |
            ${{ steps.jar.outputs.jar_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}