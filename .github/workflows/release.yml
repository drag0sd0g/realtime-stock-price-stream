name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      # Make Maven release plugin non-interactive:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Maven settings for CI release
        run: |
          mkdir -p $HOME/.m2
          cat > $HOME/.m2/settings.xml <<-EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Configure Git for CI Releases
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Run Maven Release (prepare and perform)
        run: |
          mvn -B release:prepare release:perform \
            -Darguments="-DskipTests" \
            -DautoVersionSubmodules=true \
            -DtagNameFormat=v@{project.version} \
            -DreleaseProfiles=release

      # Maven release plugin pushed a new tag, so re-checkout that tag for pack/build.
      - name: Determine the last release tag
        id: get_tag
        run: |
          TAG=$(git describe --abbrev=0 --tags)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Checkout new release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.get_tag.outputs.tag }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Java modules (package)
        run: mvn -B clean package -DskipTests

      - name: Collect Java Artifacts
        run: |
          cp mock-generator/target/mock-generator*.jar ./mock-generator.jar
          cp flink-processor/target/flink-processor*.jar ./flink-processor.jar
          cp backend-api/target/backend-api*.jar ./backend-api.jar

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Archive frontend dist
        run: |
          cd frontend/dist
          zip -r ../../frontend-dist.zip .

      - name: Create GitHub Release and Attach Artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Release ${{ steps.get_tag.outputs.tag }}
          body: |
            ## Changes in this release

            See the [CHANGELOG](https://github.com/${{ github.repository }}/compare/${{ steps.get_tag.outputs.tag }}...main) for details.

            ## Installation

            Download the backend, processor, generator, and frontend bundles below.
          files: |
            mock-generator.jar
            flink-processor.jar
            backend-api.jar
            frontend-dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}